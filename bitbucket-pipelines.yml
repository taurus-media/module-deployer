image:
  name: minkbear/php-deployer:7
pipelines:
  branches:
    master:
      - step:
          name: Deploy to Production
          deployment: production
          script:
            - dep deploy -vvv --branch master production
    develop:
      - step:
          name: Deploy to Staging
          deployment: staging
          script:
            - dep deploy -vvv --branch develop staging
